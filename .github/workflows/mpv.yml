name: MPV macOS
run-name: "MPV macOS (mpv=${{ github.event.inputs.mpv_ref || 'latest' }}, ffmpeg=${{ github.event.inputs.ffmpeg_ref || 'latest' }})"

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mpv_ref:
        description: "mpv tag, branch, or commit to build. Use latest for the newest release."
        required: false
        default: latest
      ffmpeg_ref:
        description: "FFmpeg tag, branch, or commit to build. Use latest for the newest release tag."
        required: false
        default: latest
      nuget_cleanup_action:
        description: "NuGet cache maintenance action after a successful write-enabled build."
        required: false
        type: choice
        options:
          - dry-run
          - delete
        default: dry-run
      run_ffmpeg_fate:
        description: "Run the full upstream FFmpeg FATE suite after building FFmpeg."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  params:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    outputs:
      mpv_ref: ${{ steps.resolve.outputs.mpv_ref }}
      safe_mpv_ref: ${{ steps.resolve.outputs.safe_mpv_ref }}
      ffmpeg_ref: ${{ steps.resolve.outputs.ffmpeg_ref }}
      safe_ffmpeg_ref: ${{ steps.resolve.outputs.safe_ffmpeg_ref }}
      nuget_cache_mode: ${{ steps.nuget-cache-mode.outputs.mode }}
      nuget_cache_reason: ${{ steps.nuget-cache-mode.outputs.reason }}
      nuget_feed_url: ${{ steps.nuget-cache-mode.outputs.feed_url }}
      nuget_source_name: ${{ steps.nuget-cache-mode.outputs.source_name }}
      release_enabled: ${{ steps.nuget-cache-mode.outputs.release_enabled }}
      nuget_write_enabled: ${{ steps.nuget-cache-mode.outputs.nuget_write_enabled }}
      nuget_cleanup_action: ${{ steps.nuget-cache-mode.outputs.nuget_cleanup_action }}
      release_tag: ${{ steps.release-metadata.outputs.tag }}
      release_title: ${{ steps.release-metadata.outputs.title }}
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Resolve NuGet cache mode
        id: nuget-cache-mode
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          REQUESTED_NUGET_CLEANUP_ACTION: ${{ github.event.inputs.nuget_cleanup_action || 'dry-run' }}
        run: bash scripts/cache/resolve-nuget-cache-mode.sh

      - name: Resolve source refs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MPV_REF: ${{ github.event.inputs.mpv_ref || 'latest' }}
          REQUESTED_FFMPEG_REF: ${{ github.event.inputs.ffmpeg_ref || 'latest' }}
        run: bash scripts/build/resolve-refs.sh

      - name: Compute release metadata
        id: release-metadata
        run: |
          tag="mpv-${{ steps.resolve.outputs.safe_mpv_ref }}-ffmpeg-${{ steps.resolve.outputs.safe_ffmpeg_ref }}-macos15-arm64"
          title="mpv ${{ steps.resolve.outputs.mpv_ref }} + FFmpeg ${{ steps.resolve.outputs.ffmpeg_ref }} (macOS 15 arm64)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS arm64 app
    runs-on: macos-15
    needs: params
    permissions:
      contents: read
      packages: write
    env:
      NUGET_CACHE_MODE: ${{ needs.params.outputs.nuget_cache_mode }}
      NUGET_CACHE_REASON: ${{ needs.params.outputs.nuget_cache_reason }}
      NUGET_FEED_URL: ${{ needs.params.outputs.nuget_feed_url }}
      NUGET_SOURCE_NAME: ${{ needs.params.outputs.nuget_source_name }}
    outputs:
      source_deps_succeeded: ${{ steps.build-outputs.outputs.source_deps_succeeded }}
      artifact_name: ${{ steps.build-outputs.outputs.artifact_name }}
      artifact_path: ${{ steps.build-outputs.outputs.artifact_path }}
      ffmpeg_gpl_artifact_name: ${{ steps.build-outputs.outputs.ffmpeg_gpl_artifact_name }}
      ffmpeg_gpl_artifact_path: ${{ steps.build-outputs.outputs.ffmpeg_gpl_artifact_path }}
      ffmpeg_lgpl_artifact_name: ${{ steps.build-outputs.outputs.ffmpeg_lgpl_artifact_name }}
      ffmpeg_lgpl_artifact_path: ${{ steps.build-outputs.outputs.ffmpeg_lgpl_artifact_path }}
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Checkout mpv
        uses: actions/checkout@v6
        with:
          repository: mpv-player/mpv
          ref: ${{ needs.params.outputs.mpv_ref }}
          path: mpv
          fetch-depth: 0

      - name: Prepare macOS build host
        run: bash builder/scripts/build/prepare-macos.sh

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-macos15-static-m4-${{ hashFiles('builder/cmake/CMakeLists.txt', 'builder/cmake/ports-overlay/**', 'builder/cmake/triplets/**', 'builder/cmake/toolchains/**', 'builder/scripts/build/prepare-macos.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-macos15-static-m4-${{ hashFiles('builder/cmake/CMakeLists.txt', 'builder/cmake/ports-overlay/**', 'builder/cmake/triplets/**', 'builder/cmake/toolchains/**', 'builder/scripts/build/prepare-macos.sh') }}-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-macos15-static-m4-

      - name: Build source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESOLVED_FFMPEG_REF: ${{ needs.params.outputs.ffmpeg_ref }}
        run: bash builder/scripts/build/build-source-deps.sh

      - name: Print source build logs
        if: ${{ failure() && steps.source.outcome == 'failure' }}
        run: |
          bash builder/scripts/diagnostics/print-superbuild-log.sh vcpkg-tool
          bash builder/scripts/diagnostics/print-superbuild-log.sh vcpkg-static-ports
          bash builder/scripts/diagnostics/print-superbuild-log.sh custom-static-deps
          bash builder/scripts/diagnostics/print-superbuild-log.sh vcpkg-lgpl-optional-ports

      - name: Save vcpkg binary cache
        if: ${{ always() && steps.source.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}

      - name: Build FFmpeg
        id: ffmpeg
        run: bash builder/scripts/build/build-ffmpeg.sh

      - name: Print FFmpeg build logs
        if: ${{ failure() && steps.ffmpeg.outcome == 'failure' }}
        run: |
          bash builder/scripts/diagnostics/print-superbuild-log.sh ffmpeg-static
          bash builder/scripts/diagnostics/print-superbuild-log.sh ffmpeg-lgpl

      - name: Package FFmpeg artifact
        id: ffmpeg_artifact
        env:
          SAFE_FFMPEG_REF: ${{ needs.params.outputs.safe_ffmpeg_ref }}
        run: bash builder/scripts/package/package-ffmpeg-artifact.sh

      - name: Upload GPLv3+nonfree FFmpeg artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ffmpeg_artifact.outputs.ffmpeg_gpl_name }}
          path: ${{ steps.ffmpeg_artifact.outputs.ffmpeg_gpl_path }}
          if-no-files-found: error

      - name: Upload LGPL FFmpeg artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ffmpeg_artifact.outputs.ffmpeg_lgpl_name }}
          path: ${{ steps.ffmpeg_artifact.outputs.ffmpeg_lgpl_path }}
          if-no-files-found: error

      - name: Smoke test FFmpeg install-prefix artifact
        id: ffmpeg-smoke
        run: bash builder/scripts/smoke/smoke-ffmpeg-artifact.sh

      - name: Audit FFmpeg runtime dependencies
        id: ffmpeg-runtime-audit
        run: bash builder/scripts/audit/audit-ffmpeg-runtime.sh

      - name: Run full FFmpeg FATE suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ffmpeg_fate }}
        id: ffmpeg-fate
        run: bash builder/scripts/build/run-ffmpeg-fate.sh

      - name: Configure mpv with Meson
        id: configure
        env:
          SWIFT_FLAGS: ""
        run: bash builder/scripts/build/configure-mpv.sh

      - name: Print Meson configure log
        if: ${{ failure() && steps.configure.outcome == 'failure' }}
        run: bash builder/scripts/diagnostics/print-meson-log.sh configure

      - name: Build with Meson
        id: build
        run: bash builder/scripts/build/build-test-bundle.sh build

      - name: Print Meson build log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: bash builder/scripts/diagnostics/print-meson-log.sh build

      - name: Run Meson tests
        id: tests
        run: bash builder/scripts/build/build-test-bundle.sh test

      - name: Print Meson test log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: bash builder/scripts/diagnostics/print-meson-log.sh test

      - name: Create app bundle
        id: bundle
        run: bash builder/scripts/build/build-test-bundle.sh bundle

      - name: Package mpv.app artifact
        id: artifact
        env:
          SAFE_MPV_REF: ${{ needs.params.outputs.safe_mpv_ref }}
          SAFE_FFMPEG_REF: ${{ needs.params.outputs.safe_ffmpeg_ref }}
        run: bash builder/scripts/package/package-artifact.sh

      - name: Upload mpv.app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Audit app bundle dependencies
        id: bundle-audit
        run: bash builder/scripts/audit/audit-bundle.sh

      - name: Audit retained packages and source-built features
        id: audit
        env:
          RESOLVED_MPV_REF: ${{ needs.params.outputs.mpv_ref }}
          RESOLVED_FFMPEG_REF: ${{ needs.params.outputs.ffmpeg_ref }}
        run: bash builder/scripts/audit/audit-packages.sh

      - name: Upload package audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-audit-${{ needs.params.outputs.safe_mpv_ref }}-${{ needs.params.outputs.safe_ffmpeg_ref }}
          path: audit/package-audit.md
          if-no-files-found: ignore

      - name: Print CI diagnostics
        if: ${{ failure() }}
        run: bash builder/scripts/diagnostics/print-ci-diagnostics.sh

      - name: Upload full audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-audit-${{ needs.params.outputs.safe_mpv_ref }}-${{ needs.params.outputs.safe_ffmpeg_ref }}
          path: audit
          if-no-files-found: ignore

      - name: Record build outputs
        id: build-outputs
        if: ${{ always() }}
        run: |
          source_deps_succeeded=false
          if [[ "${{ steps.source.outcome }}" == "success" ]]; then
            source_deps_succeeded=true
          fi
          printf 'source_deps_succeeded=%s\n' "$source_deps_succeeded" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "${{ steps.artifact.outputs.name }}" >> "$GITHUB_OUTPUT"
          printf 'artifact_path=%s\n' "${{ steps.artifact.outputs.path }}" >> "$GITHUB_OUTPUT"
          printf 'ffmpeg_gpl_artifact_name=%s\n' "${{ steps.ffmpeg_artifact.outputs.ffmpeg_gpl_name }}" >> "$GITHUB_OUTPUT"
          printf 'ffmpeg_gpl_artifact_path=%s\n' "${{ steps.ffmpeg_artifact.outputs.ffmpeg_gpl_path }}" >> "$GITHUB_OUTPUT"
          printf 'ffmpeg_lgpl_artifact_name=%s\n' "${{ steps.ffmpeg_artifact.outputs.ffmpeg_lgpl_name }}" >> "$GITHUB_OUTPUT"
          printf 'ffmpeg_lgpl_artifact_path=%s\n' "${{ steps.ffmpeg_artifact.outputs.ffmpeg_lgpl_path }}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - params
      - build
    if: ${{ needs.build.result == 'success' && needs.params.outputs.release_enabled == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Download mpv.app artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets/mpv

      - name: Download GPLv3+nonfree FFmpeg artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.ffmpeg_gpl_artifact_name }}
          path: release-assets/ffmpeg-gpl

      - name: Download LGPL FFmpeg artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.ffmpeg_lgpl_artifact_name }}
          path: release-assets/ffmpeg-lgpl

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.params.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.params.outputs.release_title }}
          MPV_RELEASE_ASSET: release-assets/mpv/${{ needs.build.outputs.artifact_name }}.tar.gz
          FFMPEG_GPL_RELEASE_ASSET: release-assets/ffmpeg-gpl/${{ needs.build.outputs.ffmpeg_gpl_artifact_name }}.tar.xz
          FFMPEG_LGPL_RELEASE_ASSET: release-assets/ffmpeg-lgpl/${{ needs.build.outputs.ffmpeg_lgpl_artifact_name }}.tar.xz
        run: bash scripts/release/publish-release.sh

  maintain-nuget-cache:
    name: Maintain NuGet cache
    runs-on: ubuntu-latest
    needs:
      - params
      - build
    if: ${{ always() && needs.params.outputs.nuget_write_enabled == 'true' && needs.build.outputs.source_deps_succeeded == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      NUGET_CACHE_MODE: ${{ needs.params.outputs.nuget_cache_mode }}
      NUGET_CACHE_REASON: ${{ needs.params.outputs.nuget_cache_reason }}
      NUGET_FEED_URL: ${{ needs.params.outputs.nuget_feed_url }}
      NUGET_SOURCE_NAME: ${{ needs.params.outputs.nuget_source_name }}
      NUGET_CLEANUP_ACTION: ${{ needs.params.outputs.nuget_cleanup_action }}
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Maintain expired NuGet packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cache/cleanup-nuget-cache.sh
